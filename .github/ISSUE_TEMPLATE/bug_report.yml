name: Bug report
description: Report a reproducible problem using fictional data
body:
  - type: markdown
    attributes:
      value: Do not attach personal trip backups, bookings, credentials or identity documents. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a fictional sample trip and describe the browser and whether you opened a file or a hosted site.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
